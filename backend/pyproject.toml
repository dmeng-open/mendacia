[project]
name = "mendacia-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "litellm>=1.60",
    "clingo>=5.8.2",
    "pydantic-ai-slim==2.59.0",
    "langgraph>=1.2.16,<1.3",
    "langgraph-checkpoint-postgres>=3.2.0,<3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "."
files = ["app", "migrations", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls real models; run with -m live"]
