name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mendacia
          POSTGRES_PASSWORD: mendacia
          POSTGRES_DB: mendacia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mendacia -d mendacia"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://mendacia:mendacia@localhost/mendacia
      PGPASSWORD: mendacia
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make migrate
      - run: make doctor SKIP_MODEL=1
      - run: make ci
      - name: api-types.ts matches the backend OpenAPI schema
        run: make api-types && git diff --exit-code frontend/src/api-types.ts

  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make scan-instructions

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - run: make setup
      - run: npm ci
        working-directory: frontend
      - run: make audit

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: curl -sf localhost:8000/healthz
      - run: curl -sf localhost:5173
      - if: failure()
        run: docker compose logs
