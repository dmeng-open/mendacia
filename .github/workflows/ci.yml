name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mendacia
          POSTGRES_PASSWORD: mendacia
          POSTGRES_DB: mendacia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mendacia -d mendacia"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://mendacia:mendacia@localhost/mendacia
      PGPASSWORD: mendacia
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make setup
      - run: make migrate
      - run: make ci

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -sf localhost:8000/healthz
      - if: failure()
        run: docker compose logs
